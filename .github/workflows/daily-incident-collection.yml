name: Daily incident collection

on:
  schedule:
    # 11:00 UTC = 12:00 Nigeria time (WAT), every day
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: collect and report, but save nothing'
        type: boolean
        default: true
      target_date:
        description: 'Optional: collect a specific day instead (YYYY-MM-DD)'
        type: string
        required: false

permissions:
  contents: read
  actions: write # only for the keep-alive step below

concurrency:
  group: daily-incident-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect incidents
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_REASONING: ${{ vars.AI_REASONING || 'low' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY }}
          # Scheduled runs save; manual runs default to a dry run
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: node scripts/ingest/index.js

      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-results
          path: ingest-results.json
          if-no-files-found: ignore
          retention-days: 30

      # GitHub pauses scheduled workflows after 60 days without repository activity.
      # Re-enabling the workflow from a scheduled run resets that timer.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-incident-collection.yml/enable"
